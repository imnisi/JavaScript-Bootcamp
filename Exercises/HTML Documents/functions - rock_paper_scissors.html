<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson:7 - functions</title>
  </head>
  <body>
    <h3>Rock Paper Scissors</h3>
    <button
      onclick="
    userMove = 'rock';
    playGame(userMove)"
    >
      Rock
    </button>
    <button
      onclick="
    userMove = 'paper';
    playGame(userMove)"
    >
      Paper
    </button>
    <button
      onclick="
    userMove = 'scissors';
    playGame(userMove)"
    >
      Scissors
    </button>
    <button>Reset</button>
    <button>Exit</button>

    <script>
      let userMove = ""; // Global Variable

      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber >= 0 && randomNumber <= 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber > 1 / 3 && randomNumber <= 2 / 3) {
          computerMove = "paper";
        } else {
          computerMove = "scissors";
        }
        return computerMove;
      }

      function playGame(currentUserMove) {
        const currentComputerMove = pickComputerMove();
        if (currentUserMove === currentComputerMove)
          alert(
            `You choose ${currentUserMove}\nComputer choose ${currentComputerMove}\nIt's a tie!`
          );
        else if (
          (currentUserMove === "rock" && currentComputerMove === "scissors") ||
          (currentUserMove === "paper" && currentComputerMove === "rock") ||
          (currentUserMove === "scissors" && currentComputerMove === "paper")
        ) {
          alert(
            `You choose ${currentUserMove}\nComputer choose ${currentComputerMove}\nYou Won!`
          );
        } else
          alert(
            `You choose ${currentUserMove}\nComputer choose ${currentComputerMove}\nComputer Won!`
          );
      }
    </script>
  </body>
</html>
