<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson:5 - Cart-Quantity</title>
  </head>
  <body>
    <h3>Cart Quantity</h3>
    <button onclick="console.log('Cart quantity: ', quantity)">
      Show Quantity
    </button>

    <button
      onclick="
      quantity = quantity + 1;
//    quantity++; shorthand notation
      console.log('Cart quantity: ',quantity);"
    >
      Add to Cart
    </button>
    <button
      onclick="
      quantity = quantity + 2;
//    quantity += 2;  shorthand notation
      console.log('Cart quantity: ',quantity)"
    >
      +2
    </button>
    <button
      onclick="
      quantity = quantity + 3;
      console.log('Cart quantity: ', quantity)"
    >
      +3
    </button>
    <button
      onclick="
      quantity = 0;
      console.log('Cart is reset');      
      console.log('Cart quantity: ', quantity);
    "
    >
      Reset Cart
    </button>
    <script>
      let quantity = 0;
    </script>
  </body>
</html>
