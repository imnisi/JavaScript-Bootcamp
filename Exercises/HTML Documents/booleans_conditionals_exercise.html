<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson: 6 - Booleans and Conditionals</title>
  </head>
  <body>
    <script>
      const hour = 22;
      const name = "Nishant";
      if (hour >= 6 && hour < 12) console.log("Good Morning!" + name);
      else if (hour >= 12 && hour < 17) console.log("Good afternoon!" + name);
      else console.log("Good night!" + name);

      const age = 70;
      const isHoliday = false;
      if ((age <= 6 || age >= 65) && !isHoliday) console.log("Discount!");
      else console.log("No discount!");
    </script>
  </body>
</html>
