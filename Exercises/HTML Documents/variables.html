<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson:5 - Variables</title>
  </head>
  <body>
    <script>
      let variable1 = 3;
      console.log(variable1); // 3

      let calculation = 2 + 2;
      console.log(calculation); // 4

      console.log(calculation + 2); // 6

      let message = "Hello";
      console.log(message);

      // Variable name can't start with a number
      // let 2name = 'Nisi';
      let nam3e = "Nisi";

      // Variable name can't use special character
      // let #val = 4;
      // let v%al = 4;
      // let &val = 5;
      // let val^& = 6l

      // Special characters $ and _ are allowed to declare variables
      let $name = "Nishant";
      let _name = "Nisi";
      let nam$e = "Radha";
      let nam_e = "Mohan";

      variable1 = 5;
      console.log("Updated Value:", variable1);

      variable1 = variable1 + 1;
      console.log(variable1);
     
      // Using const to declare variable
      const variable2 = 3;
      // variable2 = 5; // Error
      
      // Using var to declare variable
      var variable3 = 4;
    </script>
  </body>
</html>
