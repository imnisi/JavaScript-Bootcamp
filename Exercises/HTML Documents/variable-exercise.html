<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson: 5 - Variables</title>
  </head>
  <body>
    <script>
      let name = "Nishant Kumar";
      console.log(`My Name is: ${name}`); // Nishant Kumar

      let cost = 1 * 5 + 2 * 3 + 1 * 9;
      console.log(`Cost of food $${cost}`); // $20

      let taxCharged = (5 + 2 * 3 + 9) * 0.1;
      console.log(`Total tax: $${taxCharged}`); // $2
    </script>
  </body>
</html>
